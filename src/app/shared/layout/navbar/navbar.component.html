<header class="flex h-16 shrink-0 items-center justify-between border-b border-slate-200 bg-white px-4 sm:px-6">
  <button type="button" class="rounded-md p-2 text-slate-500 hover:bg-slate-100 lg:hidden"
          aria-label="Abrir menú" (click)="menuClicked.emit()">
    <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
    </svg>
  </button>
  <div class="hidden lg:block"></div>

  <div class="flex items-center gap-4">
    @if (auth.user(); as user) {
      <div class="flex items-center gap-3">
        <div class="flex size-9 items-center justify-center rounded-full bg-indigo-100 text-sm font-semibold uppercase text-indigo-700">
          {{ user.nombre.charAt(0) }}
        </div>
        <div class="hidden text-right leading-tight sm:block">
          <p class="text-sm font-medium text-slate-900">{{ user.nombre }}</p>
          <span class="inline-block rounded-full bg-slate-100 px-2 py-0.5 text-xs font-medium text-slate-600">
            {{ auth.roleLabel() }}
          </span>
        </div>
      </div>
    }
    <button type="button" class="btn-secondary" (click)="auth.logout()">
      <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
      </svg>
      Cerrar sesión
    </button>
  </div>
</header>
