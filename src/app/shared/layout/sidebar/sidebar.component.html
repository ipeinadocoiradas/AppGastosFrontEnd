@if (open()) {
  <div class="fixed inset-0 z-30 bg-slate-900/50 lg:hidden" (click)="closed.emit()"></div>
}
<aside
  class="fixed inset-y-0 left-0 z-40 flex w-64 shrink-0 flex-col bg-slate-900 text-slate-300 transition-transform duration-200 lg:static lg:h-screen lg:translate-x-0"
  [class]="open() ? 'translate-x-0' : '-translate-x-full'"
>
  <div class="flex h-16 items-center gap-3 border-b border-slate-800 px-6">
    <div class="flex size-9 items-center justify-center rounded-lg bg-indigo-600 text-lg font-bold text-white">GG</div>
    <span class="text-base font-semibold tracking-tight text-white">Gestión de Gastos</span>
  </div>

  <nav class="flex-1 space-y-1 overflow-y-auto px-3 py-4">
    @for (item of items(); track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="!bg-indigo-600 !text-white"
        class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition hover:bg-slate-800 hover:text-white"
        (click)="closed.emit()"
      >
        <svg class="size-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
        </svg>
        {{ item.label }}
      </a>
    }
  </nav>
</aside>
